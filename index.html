<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulación: Agente t+1 - C.C.</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>El Viaje de C.C. - Agente t+1</h1>

    <div class="contenedor-simulacion">
        
        <canvas id="simulacion" width="1000" height="400"></canvas>

        <!-- Estados y métricas principales del agente -->
        <div class="panel-estado">
            <h2>Estados del Agente</h2>
            
            <div class="dato">
                <label>Acción en el momento:</label>
                <span id="txt-estado" class="tag-estado">Dormida</span>
            </div>

            <div class="dato">
                <label>Energía actual:</label>
                <span id="txt-energia">100%</span>
                <div class="barra-energia">
                    <div id="progreso-energia" style="width: 100%;"></div>
                </div>
            </div>

            <div class="dato">
                <label>Fragmentos Integrados:</label>
                <span id="txt-fragmentos">0 / 10</span>
            </div>

            <div class="dato">
                <label>Cargando Fragmento:</label>
                <span id="txt-cargando">No</span>
            </div>

            <div class="stat-box">
    <label>Salud (HP): <span id="txt-salud">100%</span></label>
    <div style="width: 100%; background: #333; height: 15px; border-radius: 8px; overflow: hidden; margin-top: 4px;">
    <div id="progreso-salud" style="width: 100%; height: 100%; background-color: #ef4444; transition: width 0.3s;"></div>
    </div>
    </div>

    <div class="dato">
    <label>Peso Actual:</label>
    <span id="txt-peso" class="tag-estado">46.5 kg</span>
    </div>

        </div>
    </div>

    <!-- Controles de simulación -->
    <div class="contenedor-botones">
        <button id="btn-iniciar" class="btn btn-iniciar">Empezar</button>
        <button id="btn-detener" class="btn btn-detener" disabled>Detener</button>
        <button id="btn-descargar-log" class="btn" style="background-color: #3b82f6;">Descargar Log t+1 (.txt)</button>
        <button id="btn-descargar-genetico" class="btn" style="background-color: #8b5cf6;">Descargar Log Genetico (.txt)</button>
    </div>
       
    <script type="module" src="motor/main.js"></script>
</body>
</html>
